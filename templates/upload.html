<!DOCTYPE html>
<html>
<head>
    <title>upload</title>
</head>
<body>
    <h1>
        Upload your file here:
    </h1>
    <p>{{ message }}</p>

    <form action="{{ url_for('upload.upload') }}" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br><br>

        <input type="submit" value="Upload">

    </form>

    <button class="btn" type="button" onclick="window.location.href='{{ url_for('upload.user_files') }}'">My Files</button>
    <br><br>
</body>
</html>
