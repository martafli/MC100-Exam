<!DOCTYPE html>
<html>
<head>
    <title>upload</title>
</head>
<body>
    <h1>
        Welcome {{ session['user'] }}, upload your file here:
    </h1>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('upload.upload') }}" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br><br>

        <input type="submit" value="Upload">

    </form>

    <button class="btn" type="button" onclick="window.location.href='{{ url_for('upload.user_files') }}'">My Files</button>
    <br><br>
</body>
</html>
