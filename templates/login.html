<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>
    <h1>Login or Register</h1>

    <form action="{{ url_for('auth.login_user') }}" method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <br><br>

        <input type="password" name="password" placeholder="Password" required>
        <br><br>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <input type="submit" value="Login">
    </form>

    <br>

    <button class="btn" type="button" onclick="window.location.href='{{ url_for('auth.register') }}'">Register</button>

    <button class="btn" type="button" onclick="window.location.href='{{ url_for('auth.forgot_password') }}'">Forgot Password</button>

</body>
</html>
