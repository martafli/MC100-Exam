<!DOCTYPE html>
<html>
<head>
    <title>User Files</title>
</head>

<body>

    <h1>My Uploaded Files</h1>
    {% if files %} 
        <table border="2">
            <tr>
                <th>Filename</th>
                <th>Upload Date</th>
                <th>Download</th>
            </tr>

            {% for file in files %}
            <tr>
                <td>{{ file[2] }}</td>
                <td>{{ file[4] }}</td>
                <td>
                    <a href="{{ url_for('upload.download', file_id=file[0]) }}">
                        Download
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No files uploaded yet.</p>
    {% endif %}

    <br>
    <button class="btn" type="button" onclick="window.location.href='{{ url_for('upload.upload') }}'">Upload New File</button>
    <button class="btn" type="button" onclick="window.location.href='{{ url_for('auth.login') }}'">Back to Login</button>
    </a>

</body>
</html>
